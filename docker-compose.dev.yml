# Development environment with live reload:
#   docker compose -f docker-compose.dev.yml up --build
#
# Dependencies and the shared/plugin packages are part of the image. After
# changing them, add --renew-anon-volumes to the command above.

name: reiverr-dev

x-build: &build
  context: .
  target: development

services:
  backend:
    build: *build
    command: npm run dev:backend
    ports:
      - 9494:9494
    volumes:
      - ./backend:/usr/src/app/backend
      # The backend expects this directory, a fresh clone does not have it
      - ./backend/plugins:/usr/src/app/backend/plugins
      - /usr/src/app/backend/node_modules

  frontend:
    build: *build
    command: npm run dev --workspace=frontend -- --host
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/usr/src/app/frontend
      - /usr/src/app/frontend/node_modules
