// Requests Service Messages

message RequestProfile {
  string id = 1;
  string label = 2;
  optional string description = 3;
  bool can_add = 4;
  bool can_disable = 5;
  bool can_delete = 6;
  bool has_queue = 7;
  optional string queue_type = 8; // "single", "multiple", "ordered"
}

message RequestItem {
  string id = 1;
  MediaItem media_item = 2;
  string profile_id = 3;
  string status = 4; // "fulfilled", "unfulfilled", "downloading", "inactive", "disabled"
}

message QueueItem {
  string id = 1;
  string label = 2;
  bool selected = 3;
  bool disabled = 4;
  optional int32 priority = 5; // For ordered queues
  optional bool auto = 6; // Highlight that it's the automatic option
}

message WatchStatus {
  MediaItem media_item = 1;
  bool watched = 2;
  optional string last_watched_at = 3;
}

message RequestsRequest {
  optional MediaItem media_item = 1; // If provided, filters requests to the ones matching the media item
}

message RequestsResponse {
  repeated RequestProfile profiles = 1;
  repeated RequestItem items = 2;
}

message CreateRequestsRequest {
  repeated MediaItem media_items = 1;
  string profile_id = 2;
  optional bool disabled = 3;
}

message CreateRequestsResponse {
  bool success = 1;
  repeated RequestItem items = 2;
}

message RequestQueueRequest {
  string request_id = 1;
}

message RequestQueueResponse {
  repeated QueueItem queue = 1;
}

message BulkUpdateRequestsRequest {
  repeated string request_ids = 1;
  optional bool disabled = 2;
  // repeated WatchStatus watch_statuses = 3;
}

message UpdateQueueRequest {
  string request_id = 1;
  repeated string queue_item_ids = 2; // For ordered queues, the order of ids defines the queue order
}

message UpdateRequestsResponse {
  bool success = 1;
  repeated RequestItem items = 2;
}

message DeleteRequestsRequest {
  string request_id = 1;
}

message DeleteRequestsResponse {
  bool success = 1;
}

message SyncWatchStatusRequest {
  repeated WatchStatus watch_statuses = 2;
}
